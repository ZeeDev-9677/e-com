server:
  port: 8083
spring:
  application:
    name: payment-service
  config:
    import: classpath:common.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paymentdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
app:
  payment:
    max-amount: 100000
