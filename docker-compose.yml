# Run:  docker compose up -d --build         (infra only: docker compose up -d postgres redis kafka rabbitmq)
x-service: &service
  restart: unless-stopped
  depends_on: [postgres, kafka, redis, rabbitmq, discovery-server]
  environment: &env
    SPRING_PROFILES_ACTIVE: json                 # JSON structured logs
    EUREKA_URL: http://discovery-server:8761/eureka
    KAFKA_BOOTSTRAP: kafka:9092
    REDIS_HOST: redis
    RABBIT_HOST: rabbitmq
    DB_USER: postgres
    DB_PASSWORD: postgres
    JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-prod-0123456789abcdef}

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:                                          # single-node KRaft (no ZooKeeper)
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]           # UI: http://localhost:15672 (guest/guest)

  discovery-server:
    build: { context: ., args: { SERVICE: discovery-server } }
    ports: ["8761:8761"]                          # UI: http://localhost:8761

  api-gateway:
    <<: *service
    build: { context: ., args: { SERVICE: api-gateway } }
    ports: ["8080:8080"]

  user-service:
    <<: *service
    build: { context: ., args: { SERVICE: user-service } }
    ports: ["8081:8081"]
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/userdb

  order-service:
    <<: *service
    build: { context: ., args: { SERVICE: order-service } }
    ports: ["8082:8082"]
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/orderdb

  payment-service:
    <<: *service
    build: { context: ., args: { SERVICE: payment-service } }
    ports: ["8083:8083"]
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb

  notification-service:
    <<: *service
    build: { context: ., args: { SERVICE: notification-service } }
    ports: ["8084:8084"]
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/notificationdb

volumes:
  pgdata:
