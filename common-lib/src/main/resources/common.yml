# Imported by every service: spring.config.import=classpath:common.yml
spring:
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.shop.common.events
    listener:
      ack-mode: record
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  jwt:
    # >= 32 bytes. Dev default only! In prod inject from AWS Secrets Manager / K8s Secret.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-prod-0123456789abcdef}
    issuer: shop-user-service
    expiration-minutes: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
