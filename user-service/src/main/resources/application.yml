server:
  port: 8081
spring:
  application:
    name: user-service
  config:
    import: classpath:common.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/userdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, Hibernate only validates
    properties:
      hibernate.jdbc.batch_size: 50
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 1s
app:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN:true}
    email: ${ADMIN_EMAIL:admin@shop.local}
    password: ${ADMIN_PASSWORD:Admin@12345}
