apiVersion: apps/v1
kind: Deployment
metadata: { name: user-service, labels: { app: user-service } }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }   # zero-downtime rollout
  selector: { matchLabels: { app: user-service } }
  template:
    metadata:
      labels: { app: user-service }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8081", prometheus.io/path: "/actuator/prometheus" }
    spec:
      terminationGracePeriodSeconds: 45          # > spring graceful shutdown (30s)
      securityContext: { runAsNonRoot: true, runAsUser: 999 }
      containers:
        - name: user-service
          image: REGISTRY/shop/user-service:latest         # replaced by 'kustomize edit set image' in CI
          ports: [ { containerPort: 8081 } ]
          envFrom:
            - configMapRef: { name: shop-config }
            - secretRef: { name: shop-secrets }
          env:
            - name: DB_URL
              valueFrom: { configMapKeyRef: { name: shop-config, key: user-service_DB_URL, optional: true } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:                          # restart if the JVM is wedged
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 10
          readinessProbe:                         # remove from Service while not ready (e.g. DB down)
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 5
          securityContext: { allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata: { name: user-service }
spec:
  selector: { app: user-service }
  ports: [ { port: 8081, targetPort: 8081 } ]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: user-service }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: user-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: user-service }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: user-service } }
