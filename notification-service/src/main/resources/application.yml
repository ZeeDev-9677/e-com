server:
  port: 8084
spring:
  application:
    name: notification-service
  config:
    import: classpath:common.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notificationdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false      # failed => dead-letter, never infinite redelivery loop
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
